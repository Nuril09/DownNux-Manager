<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DownNux Manager</title>
  <style>
    :root {
      --bg: #121418;
      --card: #1c1f26;
      --text: #f0f3f6;
      --text-muted: #8b949e;
      --primary: #6554c0;
      --primary-hover: #5542b8;
      --accent-green: #1db954;
      --accent-green-hover: #179b45;
      --border: #30363d;
      --success: #238636;
      --error: #da3633;
    }
    body {
      margin: 0;
      padding: 12px;
      width: 336px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 500;
    }
    .badge.connected { background: rgba(35, 134, 54, 0.2); color: #3fb950; }
    .badge.disconnected { background: rgba(218, 54, 51, 0.2); color: #f85149; }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .quick-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .quick-card.spotify {
      border-color: rgba(29, 185, 84, 0.45);
      background: linear-gradient(135deg, rgba(29, 185, 84, 0.12), rgba(28, 31, 38, 0.95));
    }
    .quick-title {
      font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .quick-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .quick-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .media-list {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .media-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .media-info {
      overflow: hidden;
      flex: 1;
    }
    .media-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }
    .media-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 5px 9px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.65; cursor: default; }
    .btn.spotify { background: var(--accent-green); color: #0b140e; }
    .btn.spotify:hover { background: var(--accent-green-hover); }
    .btn.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn.secondary:hover { background: rgba(255, 255, 255, 0.14); }
    .empty {
      text-align: center;
      color: var(--text-muted);
      padding: 20px 0;
      font-size: 12px;
      line-height: 1.45;
    }
    .footer {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>DownNux Manager</span>
    </div>
    <span id="statusBadge" class="badge disconnected">Checking...</span>
  </div>

  <div id="pageMediaSection" style="display: none;">
    <div class="section-title">Quick Download from This Tab</div>
    <div id="pageMediaCard"></div>
  </div>

  <div class="section-title">Detected Media on this Tab</div>
  <div id="mediaList" class="media-list">
    <div class="empty">No media streams detected yet.<br>Play a video or open a Spotify track to download.</div>
  </div>

  <div class="footer">
    <span>By HoodTech · Ext v0.0.8</span>
    <span id="daemonVer">-</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
