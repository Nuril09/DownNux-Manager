name: Release Multiplatform Bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux-deb:
    name: Build Linux .deb & AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf aria2
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies & Build
        run: |
          pnpm install
          pnpm run gui:build
          cargo install tauri-cli --version "^2.0.0"
          cargo tauri build --bundles deb,appimage
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DownNux-Linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb

  build-windows-exe:
    name: Build Windows .exe (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies & Build
        run: |
          pnpm install
          pnpm run gui:build
          cargo install tauri-cli --version "^2.0.0"
          cargo tauri build --bundles nsis
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DownNux-Windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-macos-dmg:
    name: Build macOS .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies & Build
        run: |
          pnpm install
          pnpm run gui:build
          cargo install tauri-cli --version "^2.0.0"
          cargo tauri build --bundles dmg
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DownNux-macOS-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

