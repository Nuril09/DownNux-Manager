name: Release Multiplatform Bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows .exe (NSIS Installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies & Build GUI
        run: |
          pnpm install
          pnpm run gui:build
      - name: Bundle Standalone Daemon & Prepare Windows Binaries
        shell: pwsh
        run: |
          pnpm run daemon:bundle
          New-Item -ItemType Directory -Force -Path "src-tauri/bin"
          
          # Copy Node.js executable from runner
          $nodePath = (Get-Command node).Source
          Copy-Item $nodePath -Destination "src-tauri/bin/node.exe" -Force
          Write-Host "Bundled node.exe from $nodePath"

          # Download and bundle aria2c.exe
          Write-Host "Downloading aria2c.exe..."
          Invoke-WebRequest -Uri "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" -OutFile "aria2.zip"
          Expand-Archive -Path "aria2.zip" -DestinationPath "aria2-temp" -Force
          Copy-Item "aria2-temp\aria2-1.37.0-win-64bit-build1\aria2c.exe" -Destination "src-tauri\bin\aria2c.exe" -Force

          # Download and bundle yt-dlp.exe
          Write-Host "Downloading yt-dlp.exe..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "src-tauri\bin\yt-dlp.exe"

          # Download and bundle ffmpeg.exe
          Write-Host "Downloading ffmpeg.exe..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          Get-ChildItem -Path "ffmpeg-temp" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1 | Copy-Item -Destination "src-tauri\bin\ffmpeg.exe" -Force

          # Bundle Visual C++ runtime DLLs alongside node.exe for clean Windows machines
          foreach ($dll in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            $sysDll = Join-Path $env:SystemRoot "System32\$dll"
            if (Test-Path $sysDll) {
              Copy-Item $sysDll -Destination "src-tauri\bin\$dll" -Force
              Write-Host "Bundled $dll"
            }
          }

          Get-ChildItem -Path "src-tauri\bin"
          Get-ChildItem -Path "src-tauri\engine"
      - name: Smoke Test Windows Daemon & Aria2 Engine
        shell: pwsh
        run: |
          $env:DOWNNUX_BIN_DIR = (Resolve-Path "src-tauri\bin").Path
          $env:DOWNNUX_PORT = "44990"
          $env:UNDUH_HOME = "$env:RUNNER_TEMP\downnux-smoke-win"
          $proc = Start-Process -FilePath "src-tauri\bin\node.exe" -ArgumentList "--no-warnings","src-tauri\engine\daemon.mjs" -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 300
              if ($proc.HasExited) {
                throw "Daemon exited early with code $($proc.ExitCode)"
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:44990/api/health" -TimeoutSec 2
                if ($health.ok -and $health.engineReady) {
                  Write-Host "Windows Smoke Test HEALTH OK: $($health | ConvertTo-Json -Compress)"
                  $ready = $true
                  break
                }
                if ($health.engineError) {
                  throw "Engine error reported by daemon: $($health.engineError)"
                }
              } catch {
                if ($_.Exception.Message -like "Engine error*") { throw }
              }
            }
            if (-not $ready) {
              throw "Windows daemon failed /api/health within timeout!"
            }
            $ping = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:44990/api/rpc" -ContentType "application/json" -Body '{"method":"ping","params":{}}'
            Write-Host "Windows Smoke Test PING OK: $($ping | ConvertTo-Json -Compress)"
            $sys = Invoke-RestMethod -Uri "http://127.0.0.1:44990/api/sysinfo"
            Write-Host "Windows Smoke Test SYSINFO OK: $($sys | ConvertTo-Json -Compress)"
          } finally {
            try { Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:44990/api/rpc" -ContentType "application/json" -Body '{"method":"daemon.shutdown","params":{}}' | Out-Null } catch {}
            Start-Sleep -Milliseconds 600
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Get-Process aria2c -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
      - name: Build Windows NSIS Installer (.exe)
        run: |
          pnpm tauri build --bundles nsis
      - name: Upload Windows Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: DownNux-Windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
      - name: Publish Windows .exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-dmg:
    name: Build macOS .dmg (Disk Image)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies & Build GUI
        run: |
          pnpm install
          pnpm run gui:build
      - name: Bundle Standalone Daemon & Prepare macOS Binaries
        run: |
          pnpm run daemon:bundle
          mkdir -p src-tauri/bin

          # Copy Node.js executable
          cp "$(which node)" src-tauri/bin/node

          # Install and copy aria2c
          which aria2c || brew install aria2
          cp "$(which aria2c)" src-tauri/bin/aria2c

          # Download yt-dlp
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" -o src-tauri/bin/yt-dlp

          # Install and copy ffmpeg
          which ffmpeg || brew install ffmpeg
          cp "$(which ffmpeg)" src-tauri/bin/ffmpeg

          chmod +x src-tauri/bin/*
          ls -la src-tauri/bin/
          ls -la src-tauri/engine/
      - name: Smoke Test macOS Daemon & Aria2 Engine
        run: |
          DOWNNUX_BIN_DIR="$(pwd)/src-tauri/bin" DOWNNUX_PORT=44990 UNDUH_HOME="${RUNNER_TEMP}/downnux-smoke-mac" ./src-tauri/bin/node --no-warnings ./src-tauri/engine/daemon.mjs &
          DPID=$!
          READY=0
          for i in $(seq 1 40); do
            sleep 0.3
            HEALTH=$(curl -s http://127.0.0.1:44990/api/health || true)
            if echo "$HEALTH" | grep -q '"engineReady":true'; then
              echo "macOS Smoke Test HEALTH OK: $HEALTH"
              READY=1
              break
            fi
          done
          curl -s -X POST http://127.0.0.1:44990/api/rpc -H "Content-Type: application/json" -d '{"method":"daemon.shutdown","params":{}}' >/dev/null || true
          sleep 0.5
          kill $DPID 2>/dev/null || true
          test "$READY" = "1"
      - name: Build macOS Disk Image (.dmg)
        run: |
          pnpm tauri build --bundles dmg
      - name: Upload macOS Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: DownNux-macOS-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
      - name: Publish macOS .dmg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-deb:
    name: Build Linux .deb & AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf aria2 ffmpeg
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies & Build
        run: |
          pnpm install
          pnpm run gui:build
      - name: Bundle Standalone Daemon & Prepare Linux Binaries
        run: |
          pnpm run daemon:bundle
          mkdir -p src-tauri/bin

          cp "$(which node)" src-tauri/bin/node
          cp "$(which aria2c)" src-tauri/bin/aria2c
          cp "$(which ffmpeg)" src-tauri/bin/ffmpeg

          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp" -o src-tauri/bin/yt-dlp
          chmod +x src-tauri/bin/*
          ls -la src-tauri/bin/
          ls -la src-tauri/engine/
      - name: Smoke Test Linux Daemon & Aria2 Engine
        run: |
          DOWNNUX_BIN_DIR="$(pwd)/src-tauri/bin" DOWNNUX_PORT=44990 UNDUH_HOME="${RUNNER_TEMP}/downnux-smoke-linux" ./src-tauri/bin/node --no-warnings ./src-tauri/engine/daemon.mjs &
          DPID=$!
          READY=0
          for i in $(seq 1 40); do
            sleep 0.3
            HEALTH=$(curl -s http://127.0.0.1:44990/api/health || true)
            if echo "$HEALTH" | grep -q '"engineReady":true'; then
              echo "Linux Smoke Test HEALTH OK: $HEALTH"
              READY=1
              break
            fi
          done
          curl -s -X POST http://127.0.0.1:44990/api/rpc -H "Content-Type: application/json" -d '{"method":"daemon.shutdown","params":{}}' >/dev/null || true
          sleep 0.5
          kill $DPID 2>/dev/null || true
          test "$READY" = "1"
      - name: Build Linux Packages
        run: |
          pnpm tauri build --bundles deb,appimage
      - name: Upload Linux Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: DownNux-Linux-deb
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Publish Linux Packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
