name: Release Multiplatform Bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows .exe (NSIS Installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies & Build GUI
        run: |
          pnpm install
          pnpm run gui:build
      - name: Build Windows NSIS Installer (.exe)
        run: |
          pnpm tauri build --bundles nsis
      - name: Upload Windows Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: DownNux-Windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
      - name: Publish Windows .exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-dmg:
    name: Build macOS .dmg (Disk Image)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies & Build GUI
        run: |
          pnpm install
          pnpm run gui:build
      - name: Build macOS Disk Image (.dmg)
        run: |
          pnpm tauri build --bundles dmg
      - name: Upload macOS Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: DownNux-macOS-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
      - name: Publish macOS .dmg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-deb:
    name: Build Linux .deb & AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf aria2
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies & Build
        run: |
          pnpm install
          pnpm run gui:build
          pnpm tauri build --bundles deb,appimage
      - name: Upload Linux Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: DownNux-Linux-deb
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Publish Linux Packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
