name: Release Multiplatform Bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows .exe (NSIS Installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies & Build GUI
        run: |
          pnpm install
          pnpm run gui:build
      - name: Bundle Standalone Daemon & Prepare Windows Binaries
        shell: pwsh
        run: |
          pnpm run daemon:bundle
          New-Item -ItemType Directory -Force -Path "src-tauri/bin"
          
          # Copy Node.js executable from runner
          $nodePath = (Get-Command node).Source
          Copy-Item $nodePath -Destination "src-tauri/bin/node.exe" -Force
          Write-Host "Bundled node.exe from $nodePath"

          # Download and bundle aria2c.exe
          Write-Host "Downloading aria2c.exe..."
          Invoke-WebRequest -Uri "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" -OutFile "aria2.zip"
          Expand-Archive -Path "aria2.zip" -DestinationPath "aria2-temp" -Force
          Copy-Item "aria2-temp\aria2-1.37.0-win-64bit-build1\aria2c.exe" -Destination "src-tauri\bin\aria2c.exe" -Force

          # Download and bundle yt-dlp.exe
          Write-Host "Downloading yt-dlp.exe..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "src-tauri\bin\yt-dlp.exe"

          # Download and bundle ffmpeg.exe
          Write-Host "Downloading ffmpeg.exe..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          Get-ChildItem -Path "ffmpeg-temp" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1 | Copy-Item -Destination "src-tauri\bin\ffmpeg.exe" -Force

          Get-ChildItem -Path "src-tauri\bin"
          Get-ChildItem -Path "src-tauri\engine"
      - name: Build Windows NSIS Installer (.exe)
        run: |
          pnpm tauri build --bundles nsis
      - name: Upload Windows Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: DownNux-Windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
      - name: Publish Windows .exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-dmg:
    name: Build macOS .dmg (Disk Image)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies & Build GUI
        run: |
          pnpm install
          pnpm run gui:build
      - name: Bundle Standalone Daemon & Prepare macOS Binaries
        run: |
          pnpm run daemon:bundle
          mkdir -p src-tauri/bin

          # Copy Node.js executable
          cp "$(which node)" src-tauri/bin/node

          # Install and copy aria2c
          which aria2c || brew install aria2
          cp "$(which aria2c)" src-tauri/bin/aria2c

          # Download yt-dlp
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" -o src-tauri/bin/yt-dlp

          # Install and copy ffmpeg
          which ffmpeg || brew install ffmpeg
          cp "$(which ffmpeg)" src-tauri/bin/ffmpeg

          chmod +x src-tauri/bin/*
          ls -la src-tauri/bin/
          ls -la src-tauri/engine/
      - name: Build macOS Disk Image (.dmg)
        run: |
          pnpm tauri build --bundles dmg
      - name: Upload macOS Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: DownNux-macOS-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
      - name: Publish macOS .dmg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-deb:
    name: Build Linux .deb & AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf aria2 ffmpeg
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install dependencies & Build
        run: |
          pnpm install
          pnpm run gui:build
      - name: Bundle Standalone Daemon & Prepare Linux Binaries
        run: |
          pnpm run daemon:bundle
          mkdir -p src-tauri/bin

          cp "$(which node)" src-tauri/bin/node
          cp "$(which aria2c)" src-tauri/bin/aria2c
          cp "$(which ffmpeg)" src-tauri/bin/ffmpeg

          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp" -o src-tauri/bin/yt-dlp
          chmod +x src-tauri/bin/*
          ls -la src-tauri/bin/
          ls -la src-tauri/engine/
      - name: Build Linux Packages
        run: |
          pnpm tauri build --bundles deb,appimage
      - name: Upload Linux Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: DownNux-Linux-deb
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Publish Linux Packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
